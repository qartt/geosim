name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build && npm test
      - name: ZIP do plugin WordPress
        run: cd wordpress && zip -r ../qartt-geosim.zip qartt-geosim
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            qartt-geosim.zip
            dist/geosim.min.js
            dist/geosim.esm.js
