name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: dist/ atualizado
        run: git diff --exit-code -- dist docs/geosim.min.js wordpress/qartt-geosim/assets/js/geosim.min.js
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Lint do plugin
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
